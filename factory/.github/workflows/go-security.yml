name: Go security

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minimum:
    name: Scan minimum Go version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Show minimum Go toolchain
        run: go version
      - name: Check reachable Go vulnerabilities
        run: just vuln

  latest:
    name: Scan latest Go 1.25 patch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.x
          check-latest: true
          cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Show latest Go 1.25 toolchain
        run: go version
      - name: Check reachable Go vulnerabilities
        run: just vuln

  supported-go-1-26:
    name: Scan Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - 1.26.6
          - 1.26.x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
          cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Show Go toolchain
        run: go version
      - name: Check reachable Go vulnerabilities
        run: just vuln

  propose-minimum-update:
    name: Propose a newer Go 1.25 minimum
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.x
          check-latest: true
          cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Update the declared minimum
        run: ./scripts/update-go-minimum.sh "$(go env GOVERSION)"
      - name: Verify the proposed minimum
        run: |
          go mod tidy
          just vuln
          just test-tooling
      - name: Open an update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "The declared Go minimum is current."
            exit 0
          fi
          version="$(awk '$1 == "go" { print $2; exit }' go.mod)"
          branch="automation/go-${version}-minimum"
          title="chore: require Go ${version}"
          body="Updates Factory's minimum Go 1.25 patch and release toolchain pin to ${version}, then refreshes the matching contributor and security documentation. Generated by the weekly Go security workflow."
          if gh pr list --head "$branch" --state open --json url --jq '.[]?.url' | grep -q .; then
            echo "An update pull request already exists."
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null; then
            if gh pr create --base main --head "$branch" --title "$title" --body "$body"; then
              exit 0
            fi
            if ! gh issue list --state open --search "Go ${version} update PR in:title" --json number --jq '.[]?.number' | grep -q .; then
              gh issue create \
                --title "Automation could not open the Go ${version} update PR" \
                --body "The weekly Go security workflow previously pushed branch \`${branch}\`, but repository policy prevented it from opening a pull request. Open a pull request from that branch to apply the proposed minimum-toolchain update."
            fi
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add go.mod .release/go-version README.md CONTRIBUTING.md SECURITY.md docs/local.md .github/ISSUE_TEMPLATE/bug_report.yml
          git commit -m "chore: require Go ${version}"
          git push origin "HEAD:refs/heads/${branch}"
          if ! gh pr create --base main --head "$branch" --title "$title" --body "$body"; then
            if ! gh issue list --state open --search "Go ${version} update PR in:title" --json number --jq '.[]?.number' | grep -q .; then
              gh issue create \
                --title "Automation could not open the Go ${version} update PR" \
                --body "The weekly Go security workflow pushed branch \`${branch}\`, but repository policy prevented it from opening a pull request. Open a pull request from that branch to apply the proposed minimum-toolchain update."
            fi
          fi
