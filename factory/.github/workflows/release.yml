name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: SemVer used for a dry-run build, such as v0.0.0-test.manual
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build reproducible artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .release/go-version
          cache: true
      - name: Verify release tag provenance
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          tag="refs/tags/$RELEASE_VERSION"
          test "$(git cat-file -t "$tag")" = tag
          test "$(git rev-parse "$tag^{}")" = "$GITHUB_SHA"
          remote_commit=$(git ls-remote --tags origin "$tag^{}" | awk '{print $1}')
          test -n "$remote_commit"
          test "$remote_commit" = "$GITHUB_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
      - name: Build release set
        run: ./scripts/release.sh "$RELEASE_VERSION" "$(git rev-parse HEAD)" dist
      - name: Verify every cross-compiled artifact
        run: |
          commit=$(git rev-parse HEAD)
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            ./scripts/verify-release.sh dist "$RELEASE_VERSION" "$commit" "$target"
          done
      - name: Upload release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 14

  verify-native:
    name: Verify ${{ matrix.target }} natively
    needs: build
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux/amd64
            runner: ubuntu-24.04
          - target: linux/arm64
            runner: ubuntu-24.04-arm
          - target: darwin/amd64
            runner: macos-15-intel
          - target: darwin/arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .release/go-version
          cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: Verify and execute release binaries
        run: ./scripts/verify-release.sh dist "$RELEASE_VERSION" "$(git rev-parse HEAD)" "${{ matrix.target }}" execute

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && !startsWith(github.ref_name, 'v0.0.0-test')
    needs: [build, verify-native]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: Create GitHub release
        shell: bash
        run: |
          set -euo pipefail
          remote_commit=$(git ls-remote --tags "https://github.com/$GH_REPO.git" "refs/tags/$RELEASE_VERSION^{}" | awk '{print $1}')
          test -n "$remote_commit"
          test "$remote_commit" = "$GITHUB_SHA"
          test "$(jq -r .commit dist/release-manifest.json)" = "$GITHUB_SHA"
          flags=(--verify-tag --generate-notes)
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_VERSION" dist/* \
            --title "Factory $RELEASE_VERSION" \
            --notes "See CHANGELOG.md in each archive for compatibility and operator actions." \
            "${flags[@]}"
